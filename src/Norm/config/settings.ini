; Human-editable Norm settings.
; Add future operator settings here instead of creating one-purpose config files.

[paths]
runtime_root = .
documents_root = %USERPROFILE%\Documents\Norm
workspace_root = workspace
temp_root = temp
verbatim_writer = plugins/verbatim_lines/src/_cli.py

[file_access]
; Semicolon-separated roots. Tokens: @runtime, @documents, @workspace, @temp, @docs, @plugins.
; Enforcement applies to Python/native/plugin filesystem APIs. PowerShell remains a known escape hatch for now.
read_directories = @workspace;@temp;@docs;@plugins;@documents
write_directories = @workspace;@temp;@docs;@plugins;@documents
enforce_read_directories = false
enforce_write_directories = false
read_chunk_bytes = 393216
read_chunk_max_bytes = 4194304
read_processing_buffer_bytes = 25165824

[network]
current_machine = localhost
current_domain = example.invalid
require_tailscale = false
ollama_host = loopback
ollama_port = 11434
norm_host = loopback
norm_port = 12543
activity_host = loopback
activity_port = 8766
postgres_host = loopback
postgres_port = 5432
redis_host = loopback
redis_port = 6379

[postgres]
user = norm
database = norm
schema = norm_runtime
stocks_database = stocks_api
pool_min_size = 2
pool_max_size = 8
pool_timeout_seconds = 30
pool_max_waiting = 64
pool_max_idle_seconds = 600
pool_max_lifetime_seconds = 3600

[ssh]
enabled = false
root = .ssh
executable = C:\Windows\System32\OpenSSH\ssh.exe
known_hosts_file = known_hosts
strict_host_key_checking = accept-new
connect_timeout_seconds = 8
ca8d_host =
ca8d_docker_host =
ca8d_port = 22
ca8d_user =
ca8d_identity_file = norm_remote_ed25519

[documentation]
readme = docs/README.md
current_status = docs/CURRENT_STATUS.md
development_notes = docs/DEVELOPMENT_NOTES.md
release_notes = docs/RELEASE_NOTES.md
future_implementation_notes = docs/FUTURE_IMPLEMENTATION_NOTES.md

[backup]
backup_root = %USERPROFILE%\Documents\Norm-backups
postgres_dump_executable = C:\Program Files\PostgreSQL\17\bin\pg_dump.exe
postgres_restore_executable = C:\Program Files\PostgreSQL\17\bin\pg_restore.exe
postgres_schema = norm_runtime

[environment]
python_version = 3.14.0
venv_path = .venv
requirements_file = tools/requirements-lock.txt
secrets_file = %APPDATA%\Norm\.env
torch_version = 2.14.0+cu126
torch_index_url = https://download.pytorch.org/whl/cu126

[temp]
cleanup_enabled = true
max_age_hours = 72
recovery_max_age_hours = 168

[plugins]
root = plugins
registry_file = .registry.json
helper = tools/norm_plugins.py

[project]
name = Norm
version = 0.53.14
author = hermit-node
repository = https://github.com/hermit-node/kh-norm

; Full backups contain package/runtime source, docs, plugins, .ssh, configured secrets, workspace, selected recovery state, and PostgreSQL norm_runtime.
; Rebuildable .venv/build outputs are excluded; the reusable installer recreates or reuses the environment.
[backup_policy]
runtime_exclude_dirs = .venv;staging;build;dist;__pycache__;backup;backups;state/file-backups
workspace_exclude_dirs = staging;build;dist;__pycache__;backup;backups
