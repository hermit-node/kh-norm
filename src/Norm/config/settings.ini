; Human-editable Norm settings.
; Add future operator settings here instead of creating one-purpose config files.

[paths]
documents_root = %USERPROFILE%\Documents\Norm

[network]
current_machine = khzz
current_domain = boga-dace.ts.net
require_tailscale = true
ollama_host = loopback
ollama_port = 11434
norm_host = current
norm_port = 12543
activity_host = current
activity_port = 8766
postgres_host = current
postgres_port = 25434
redis_host = current
redis_port = 6379

[ssh]
enabled = true
root = .ssh
executable = C:\Program Files\Git\usr\bin\ssh.exe
known_hosts_file = known_hosts
strict_host_key_checking = accept-new
connect_timeout_seconds = 8
ca8d_host = kh-ca8d.boga-dace.ts.net
ca8d_docker_host = kh-ca8d-docker.boga-dace.ts.net
ca8d_port = 22
ca8d_user = requantainment
ca8d_identity_file = ca8d_norm_ed25519

[documentation]
readme = README.md
current_status = CURRENT_STATUS.md
development_notes = DEVELOPMENT_NOTES.md
release_notes = RELEASE_NOTES.md
future_implementation_notes = FUTURE_IMPLEMENTATION_NOTES.md

[backup]
backup_root = %USERPROFILE%\Documents\Norm-backups
postgres_dump_executable = C:\Program Files\PostgreSQL\17\bin\pg_dump.exe
postgres_restore_executable = C:\Program Files\PostgreSQL\17\bin\pg_restore.exe
postgres_schema = norm_runtime

[environment]
python_version = 3.14.0
venv_path = .venv
requirements_file = tools\requirements-lock.txt
secrets_file = %APPDATA%\Norm\.env
torch_version = 2.14.0+cu126
torch_index_url = https://download.pytorch.org/whl/cu126

[plugins]
root = plugins
registry_file = .registry.json
helper = tools\norm_plugins.py

[project]
name = Norm
version = 0.52.0
author = KernelHermit
repository = https://github.com/hermit-node

; ZIPs contain the PostgreSQL norm_runtime schema, workspace, and runtime.
; Rebuildable environments/build outputs are excluded; restore tooling recreates them.
[backup_policy]
runtime_exclude_dirs = .venv;staging;build;dist;__pycache__;backup;backups;state/file-backups
workspace_exclude_dirs = images/analysis;staging;build;dist;__pycache__;backup;backups
